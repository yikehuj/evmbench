[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]

remappings = [
    "ds-test/=lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
    "hardhat/=lib/hardhat/",
]

solc = "0.8.11"
evm_version = "london"
optimizer = true
optimizer_runs = 200
